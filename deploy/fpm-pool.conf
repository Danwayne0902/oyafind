; OyaFind PHP-FPM pool.
;
; The php:8.2-fpm defaults allow five children, which makes the app queue
; behind itself long before the CPU or MySQL is busy. Sixteen children fit
; comfortably in the 19 GB the VM has and leave headroom for MySQL.
; pm.max_requests recycles workers so a slow leak cannot accumulate.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
